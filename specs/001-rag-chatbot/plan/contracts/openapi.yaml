openapi: 3.0.3
info:
  title: RAG Chatbot API
  description: API for the Retrieval-Augmented Generation (RAG) chatbot that answers questions about book content
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the application
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-01-21T10:00:00Z"
  
  /ingest:
    post:
      summary: Ingest a book into the RAG system
      description: Upload and process a book for use with the RAG chatbot (admin-only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - title
                - author
              properties:
                file:
                  type: string
                  format: binary
                  description: The book content file (text format)
                title:
                  type: string
                  description: The title of the book
                  example: "Introduction to Machine Learning"
                author:
                  type: string
                  description: The author of the book
                  example: "Jane Smith"
                isbn:
                  type: string
                  description: The ISBN of the book (optional)
                  example: "978-0-123456-78-9"
      responses:
        '200':
          description: Book successfully ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Book successfully ingested"
                  book_id:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  
  /chat:
    post:
      summary: Submit a query to the RAG chatbot
      description: Ask questions about the book content and receive AI-generated responses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - book_id
                - mode
              properties:
                query:
                  type: string
                  description: The question or query to ask
                  example: "What are the main concepts discussed in chapter 3?"
                book_id:
                  type: string
                  format: uuid
                  description: The ID of the book to query
                  example: "123e4567-e89b-12d3-a456-426614174000"
                selected_text:
                  type: string
                  description: Optional text selected by the user for focused queries
                  example: "The concept of supervised learning involves..."
                mode:
                  type: string
                  enum: [full, selected]
                  description: Query mode - 'full' for entire book, 'selected' for selected text only
                  example: "full"
                session_id:
                  type: string
                  description: Optional session identifier for grouping related queries
                  example: "sess-abc123"
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The AI-generated response to the query
                    example: "Chapter 3 discusses supervised learning, which involves..."
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        chunk_id:
                          type: string
                          format: uuid
                        page_number:
                          type: integer
                        section_title:
                          type: string
                    description: List of sources used to generate the response
                  confidence_score:
                    type: number
                    format: float
                    minimum: 0.0
                    maximum: 1.0
                    description: Confidence score of the response
                    example: 0.92
        '400':
          description: Invalid input
        '500':
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Admin authentication for ingestion endpoints